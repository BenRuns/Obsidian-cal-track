name: Bug report
description: Report a problem with Cal Track
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please fill in as much as you can so the problem can be reproduced.

  - type: textarea
    id: description
    attributes:
      label: Describe the issue
      description: What happened, and what did you expect to happen instead?
      placeholder: |
        When I log "1 medium" banana, the row shows 0 kcal instead of about 105.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run "Add food to log" from the command palette
        2. Search for "banana" and pick "Bananas, raw" (USDA)
        3. Choose 1 medium
        4. See the row
    validations:
      required: false

  - type: textarea
    id: sample-markdown
    attributes:
      label: Sample markdown
      description: If the problem involves a food log, paste the table (including the `{{calc}}` marker). It will be formatted as markdown automatically.
      render: markdown
      placeholder: |
        {{calc}}

        | Food | Qty | Unit | kcal |
        | --- | ---: | --- | ---: |
        | Bananas, raw | 1 | medium | 105 |
        | **Total** |  |  | =SUM(D1:D1) |

  - type: dropdown
    id: source
    attributes:
      label: Which food source is involved?
      multiple: true
      options:
        - USDA FoodData Central
        - Open Food Facts
        - My foods
        - Custom food
        - Not food-specific
        - Not sure

  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version
      description: Found under Settings → General → App → Current version (include the installer version if shown).
      placeholder: "e.g. 1.7.7 (installer 1.7.7)"
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Cal Track and Table Calc versions
      description: Found under Settings → Community plugins.
      placeholder: "e.g. Cal Track 0.1.0, Table Calc 2.2.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
        - iOS
        - iPadOS
        - Android
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device information
      description: Device model and OS version.
      placeholder: "e.g. MacBook Pro M2, macOS 15.1 / Pixel 8, Android 15"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, console errors (Ctrl/Cmd+Shift+I → Console), other plugins or themes that might interfere, etc.
