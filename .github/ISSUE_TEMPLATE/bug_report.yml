name: Bug report
description: Report a problem with Cal Track
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please fill in as much as you can so the problem can be reproduced.

  - type: textarea
    id: description
    attributes:
      label: Describe the issue
      description: What happened, and what did you expect to happen instead?
      placeholder: |
        When I log "1 medium" banana, the daily log shows 0 kcal instead of about 105.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run "Add food to today" from the command palette
        2. Search for "banana" (Enter) and pick "Bananas, raw" (USDA)
        3. Choose 1 medium, Breakfast
        4. See the row in today's note
    validations:
      required: false

  - type: textarea
    id: sample-log
    attributes:
      label: Food log rows
      description: If the problem involves logged foods, paste the header and the affected rows from `Cal Track/log.csv`. If it involves My foods or a combo, paste its row from `Cal Track/Foods.md` instead.
      render: text
      placeholder: |
        id,date,time,meal,food,qty,unit,kcal,protein,carbs,fat
        mgx3k2a1b,2026-10-15,08:05,Breakfast,"Bananas, raw",1,medium,105,1.3,26.9,0.4

  - type: dropdown
    id: source
    attributes:
      label: Which food source is involved?
      multiple: true
      options:
        - USDA FoodData Central
        - Open Food Facts
        - My foods
        - Custom food
        - Combo
        - Not food-specific
        - Not sure

  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version
      description: Found under Settings → General → App → Current version (include the installer version if shown).
      placeholder: "e.g. 1.7.7 (installer 1.7.7)"
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Cal Track version
      description: Found under Settings → Community plugins.
      placeholder: "e.g. 0.1.0"
    validations:
      required: true

  - type: dropdown
    id: daily-notes
    attributes:
      label: Daily notes plugin
      description: Cal Track logs into daily notes from one of these.
      options:
        - Periodic Notes
        - Obsidian's core Daily notes
        - Neither is turned on
        - Not sure
    validations:
      required: true

  - type: input
    id: usda-key
    attributes:
      label: USDA API key
      description: Do you use your own USDA key, or the shared DEMO_KEY? Don't paste the key itself.
      placeholder: "e.g. my own key / DEMO_KEY"

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
        - iOS
        - iPadOS
        - Android
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device information
      description: Device model and OS version.
      placeholder: "e.g. MacBook Pro M2, macOS 15.1 / Pixel 8, Android 15"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, console errors (Ctrl/Cmd+Shift+I → Console), other plugins or themes that might interfere, etc.
